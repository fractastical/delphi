name: Deploy MCP server

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      # Lean laws served by the lean_* tools: a new or changed law redeploys the hosted server.
      - "lean/registry/**"
      - "lean/laws.json"
      - "lean/constraints.json"
      - "lean/empirical.json"
      - "lean/eliminate/browser-check.mjs"
      - "lean/Delphi/**"
      - "lib/lean-source.mjs"
      - "lib/lean-scope.mjs"
      - "sim-engine/tools/lean-tools.mjs"
      - "sim-engine/lib/envelope.mjs"
      - "sim-engine/lean-cli.mjs"
      - "docs/claims.json"
      # Omics tools and design_score, and the files they read at run time.
      - "omics/index/**"
      - "sim-engine/tools/**"
      - "sim-engine/lib/**"
      - "sim-engine/params/**"
      - "sim-engine/scenarios/**"
      - "sim-engine/validate/**"
      - "anatomy-model/parametric/**"
      - "conditions/baseline.json"
      - "dashboard/public/blueprint3d/data.json"
      - "dashboard/public/blueprint3d/model/**"
      - "dashboard/public/blueprint3d/partedit.js"
      - "development/**"
      - "physiology/**"
      - "genotype/map.vetted.slim.json"
      - "genotype/causal-chains.json"
      - "genotype/interventions.json"
      - "genotype/pathways.slim.json"
      - "genotype/sequence-layer.json"
      - "sequences/**"
      # LeanBio tools and the files they read at run time.
      - "pipeline/leanbio/**"
      - "holdout/exam.json"
      - "holdout/split.json"
      - "organisms/merged/taxa.json"
      - "**/nanopubs/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "fly.toml"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

concurrency: deploy-mcp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
