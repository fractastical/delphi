# fly launch --no-deploy --copy-config --config forum/fly.toml --dockerfile forum/Dockerfile
# fly volumes create forum_data --size 1 --region iad --config forum/fly.toml
# fly deploy --config forum/fly.toml --dockerfile forum/Dockerfile
app = "science-claw-forum"
primary_region = "iad"

[build]
  dockerfile = "forum/Dockerfile"

[env]
  FORUM_PORT = "8080"
  FORUM_DB = "/data/forum.db"
  FORUM_PUBLIC_URL = "https://science-claw-forum.fly.dev"

[[mounts]]
  source = "forum_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
