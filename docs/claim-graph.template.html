<style>

 --ink:#efe6cf;--mut:#a7b0c2;--line:rgba(229,192,123,.26);--serif:Georgia,'Times New Roman',serif;--sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}

</style></head><body><main>
<header class="masthead"><!--__SEAL__--><div>
<h1>Claim Graph</h1>
<p class="subtitle" id="subtitle"></p></div>
<a href="claims-query.html" style="margin-left:auto;font-size:12.5px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none">Query claims →</a></header>

<div class="toolbar">
 <span class="lab">Group by</span><button id="m-thinker" class="on" onclick="setMode('thinker')">Thinker</button><button id="m-date" onclick="setMode('date')">Date</button>
 <span class="sep"></span>
 <button onclick="expandAll()">Expand all chapters</button><button onclick="collapseAll()">Collapse all</button>
 <span class="sep"></span>
 <input id="search" type="search" placeholder="Search claims…" aria-label="Search claims">
 <span class="small mut" id="searchinfo"></span>
 <span class="sep"></span>
 <span class="lab">Show only</span>
 <label class="thr" title="Minimum truth probability (P)"><span class="pill pP">P ≥</span><input id="minP" type="range" min="0" max="1" step="0.05" value="0"><b id="minPv">any</b></label>
 <label class="thr" title="Minimum testability score (T). Only Darwin's claims have T scores so far."><span class="pill pT">T ≥</span><input id="minT" type="range" min="0" max="1" step="0.05" value="0"><b id="minTv">any</b></label>
 <button id="clearthr" onclick="setThresholds(0, 0)" style="display:none">Clear</button>
 <span class="small mut" id="shown"></span>
</div>
<div class="legend" id="legend"></div>

<div id="graphwrap"><svg id="graph" aria-label="Claim graph (zoomable)"></svg>
<div class="zoomctl"><button onclick="zoomStep(0.8)" title="Zoom out">−</button><span id="zoompct">100%</span><button onclick="zoomStep(1.25)" title="Zoom in">+</button>
<button class="zlab" onclick="fitView()" title="Fit (F)">Fit</button><button class="zlab" onclick="resetView()" title="Reset (0)">Reset</button></div></div>
<p class="mut small" style="margin:6px 2px 0">Click any card to open it. Click a chapter to show its claims as cards. Pinch or ⌘-scroll zooms, drag pans, <b>F</b> fits, <b>Esc</b> closes the inspector.</p>
<div id="drawer"></div>
<div class="footer">✦ Decentralized Epistemic Layer for Probabilistic Hypothesis Inference ✦</div>
</main>
<script>
const DATA = /*__DATA__*/null;
const CLAIMS = DATA.claims, byId = Object.fromEntries(CLAIMS.map(c => [c.id, c]));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---- proof status, red to green ---- */
const STATUS = { refuted: { v: 0, label: 'Refuted as stated' }, untested: { v: 0.45, label: 'Not yet proven or tested' },
  partial: { v: 0.75, label: 'Partly proved' }, proved: { v: 1, label: 'Proved (within its model)' } };
const STOPS = [[0,[224,87,79]],[0.45,[229,184,75]],[1,[79,192,127]]];
const ramp = v => { let i = 0; while (i < STOPS.length - 2 && v > STOPS[i+1][0]) i++;
  const [a, ca] = STOPS[i], [b, cb] = STOPS[i+1], t = Math.max(0, Math.min(1, (v - a) / (b - a)));
  return `rgb(${ca.map((x, k) => Math.round(x + (cb[k] - x) * t)).join(',')})`; };
const scol = s => ramp(STATUS[s].v);
const meanStatus = cs => cs.reduce((s, c) => s + STATUS[c.status].v, 0) / cs.length;
const fmt = v => v == null ? '–' : v.toFixed(2);
const short = t => /Maynard Smith$/.test(t) ? 'Maynard Smith' : t.split(' ').slice(-1)[0];
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const live = CLAIMS.filter(c => c.registry === 'production').length;
const truthN = CLAIMS.filter(c => c.truth != null).length;
$('subtitle').textContent = `${CLAIMS.length} claims from ${new Set(CLAIMS.map(c => c.thinker)).size} thinkers · ${live} live as nanopubs · built ${DATA.built}`;
$('legend').innerHTML = `<span><b>Corner triangle</b> = proof status:</span>` +
  Object.entries(STATUS).map(([s, d]) => `<span><i class="tri" style="background:${scol(s)}"></i>${d.label} (${CLAIMS.filter(c => c.status === s).length})</span>`).join('') +
  `<span>· dashed card = draft, not published</span>` +
  `<span>· <b>On each edge</b>: <span class="pill pT">T</span>testability, how far today's open data could settle it · <span class="pill pP">P</span>truth, blind GPT and Grok assessors' mean probability that it is true${truthN ? '' : ' (not scored yet)'} · 0–1</span>`;

/* ---- tree model: root → group (thinker or decade) → chapter (books) → claim ---- */
const S = { mode: 'thinker', sel: null, q: '', minP: 0, minT: 0 };
const OPEN = new Set();
let TREE = null;
// Unscored claims fail any non-zero threshold.
const passes = c => (!S.minP || (c.truth ?? -1) >= S.minP) && (!S.minT || (c.resolvability ?? -1) >= S.minT);
const filtering = () => S.minP > 0 || S.minT > 0;
function buildTree(mode) {
  const gkey = c => mode === 'thinker' ? c.thinker : `${Math.floor(c.year / 10) * 10}s`;
  const groups = new Map(), CS = CLAIMS.filter(passes), liveN = CS.filter(c => c.registry === 'production').length;
  for (const c of CS) { const k = gkey(c); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); }
  const gl = [...groups.entries()].map(([k, cs]) => ({ k, cs: cs.slice().sort((a, b) => a.year - b.year), year: Math.min(...cs.map(c => c.year)) }))
    .sort((a, b) => a.year - b.year);
  const root = { id: 'root', kind: 'root', label: 'All claims', sub: `${filtering() ? `${CS.length} of ${CLAIMS.length}` : CLAIMS.length} claims · ${liveN} live`, claims: CS, children: [] };
  for (const g of gl) {
    const thinkers = [...new Set(g.cs.map(c => c.thinker))], years = [...new Set(g.cs.map(c => c.year))];
    const gn = { id: `g:${g.k}`, kind: 'group', label: g.k, claims: g.cs, children: [],
      sub: `${mode === 'thinker' ? (years.length > 1 ? `${years[0]}–${years.at(-1)}` : years[0]) : thinkers.map(short).join(', ')} · ${plural(g.cs.length, 'claim')}` };
    root.children.push(gn);
    // Books get one card per chapter; papers' claims hang directly under the group.
    const chapters = new Map();
    for (const c of g.cs) {
      if (!c.section || c.section.startsWith(c.work)) { gn.children.push(claimNode(c, mode)); continue; }
      const ck = `${c.thinker}|${c.section}`;
      if (!chapters.has(ck)) { const ch = { id: `c:${g.k}:${ck}`, kind: 'chapter', label: c.section, claims: [], children: [], thinker: c.thinker, year: c.year }; chapters.set(ck, ch); gn.children.push(ch); }
      chapters.get(ck).claims.push(c);
    }
    for (const ch of chapters.values()) {
      ch.sub = `${mode === 'date' ? `${short(ch.thinker)} ${ch.year} · ` : ''}${plural(ch.claims.length, 'claim')}`;
      ch.children = ch.claims.map(c => claimNode(c, mode));
    }
  }
  return root;
}
const claimNode = (c, mode) => ({ id: `n:${c.id}`, kind: 'claim', label: c.label, claim: c, claims: [c], children: [],
  sub: mode === 'date' ? `${short(c.thinker)} ${c.year}` : c.kind });

/* ---- layout: columns of stacked cards ---- */
const W = 158, H = 76, COLW = W + 44, GAP = 38, TOP = 30;
let NODES = [], EDGES = [], WIDTH = 0, HEIGHT = 0;
function layout() {
  NODES = []; EDGES = [];
  const root = TREE, cols = root.children.length;
  WIDTH = Math.max(1200, cols * COLW + 40);
  const place = (n, x, y) => { n.x = x; n.y = y; NODES.push(n); };
  place(root, WIDTH / 2 - W / 2, TOP);
  let maxY = 0;
  root.children.forEach((g, i) => {
    const x = 20 + i * COLW + (COLW - W) / 2;
    place(g, x, TOP + H + 70);
    EDGES.push({ from: root, to: g, kind: 'tree' });
    let y = g.y + H + GAP, prev = g;
    for (const ch of g.children) {
      place(ch, x, y); EDGES.push({ from: prev, to: ch, kind: ch.kind === 'claim' ? 'claim' : 'spine' });
      y += H + GAP; prev = ch;
      if (ch.kind === 'chapter' && OPEN.has(ch.id)) {
        let p = ch;
        for (const cn of ch.children) { place(cn, x + 12, y); EDGES.push({ from: p, to: cn, kind: 'claim' }); y += H + GAP; p = cn; }
        y += 10;
      }
    }
    maxY = Math.max(maxY, y);
  });
  HEIGHT = maxY + 20;
}

/* ---- drawing ---- */
const NS = 'http://www.w3.org/2000/svg';
function wrap(text, max) { const words = String(text).split(' '), out = []; let cur = '';
  words.forEach(w => { if ((cur + ' ' + w).trim().length > max) { if (cur) out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }); if (cur) out.push(cur); return out; }
const matches = c => !S.q || `${c.label} ${c.text} ${c.thinker} ${c.work} ${c.section} ${c.year}`.toLowerCase().includes(S.q);
function draw() {
  layout();
  const svg = $('graph');
  svg.setAttribute('width', WIDTH); svg.setAttribute('height', HEIGHT); svg.setAttribute('viewBox', `0 0 ${WIDTH} ${HEIGHT}`);
  svg.innerHTML = '';
  const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); (parent || vp).appendChild(el); return el; };
  const vp = document.createElementNS(NS, 'g'); vp.id = 'viewport'; vp.setAttribute('transform', viewTransform()); svg.appendChild(vp);
  const hit = n => n.claims.some(matches);
  for (const e of EDGES) {
    const a = e.from, b = e.to, x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y, mid = (y1 + y2) / 2;
    const d = Math.abs(x1 - x2) < 4 ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}`;
    const faded = S.q && !hit(b);
    mk('path', { d, fill: 'none', stroke: e.kind === 'claim' ? 'rgba(229,192,123,.55)' : 'rgba(229,192,123,.28)', 'stroke-width': e.kind === 'claim' ? 1.4 : 1.2, opacity: faded ? .2 : 1 });
    if (e.kind === 'claim') {
      const c = b.claim, py = y2 - GAP / 2, g = mk('g', { opacity: faded ? .2 : 1 });
      const pill = (x, lab, v, fill) => { mk('rect', { x, y: py - 7.5, width: 46, height: 15, rx: 4, fill: v == null ? '#2a3a5e' : fill }, g);
        const t = mk('text', { x: x + 23, y: py + 3.5, 'text-anchor': 'middle', 'font-size': 9.5, 'font-weight': 700, fill: v == null ? '#a7b0c2' : '#14213d' }, g); t.textContent = `${lab} ${fmt(v)}`; };
      pill(x2 - 49, 'T', c.resolvability, '#e5c07b'); pill(x2 + 3, 'P', c.truth, '#8fb7ff');
    }
  }
  for (const n of NODES) {
    const g = mk('g', {}); g.style.cursor = 'pointer';
    g.addEventListener('click', () => { if (suppressClick) return; select(n); });
    const root = n.kind === 'root', sel = S.sel === n.id, draft = n.claim?.draft, open = OPEN.has(n.id);
    const faded = S.q && !hit(n);
    g.setAttribute('opacity', faded ? .25 : 1);
    mk('rect', { x: n.x, y: n.y, width: W, height: H, rx: root ? 38 : 8, fill: root ? '#14213d' : n.kind === 'claim' ? '#1c2c4f' : '#22355d',
      stroke: sel ? '#f2dba6' : root ? '#e5c07b' : S.q && hit(n) ? '#f2dba6' : 'rgba(229,192,123,.42)', 'stroke-width': sel ? 2.6 : root ? 2.4 : 1.2, 'stroke-dasharray': draft ? '5 3' : '' }, g);
    if (root) mk('rect', { x: n.x + 5, y: n.y + 5, width: W - 10, height: H - 10, rx: 33, fill: 'none', stroke: '#e5c07b', 'stroke-width': 1, 'stroke-dasharray': '2 4' }, g);
    else mk('path', { d: `M${n.x + 1},${n.y + 1} h18 L${n.x + 1},${n.y + 19} z`, fill: ramp(meanStatus(n.claims)) }, g);
    const lines = wrap(n.label, root ? 12 : 23).slice(0, 2);
    if (wrap(n.label, 23).length > 2) lines[1] = lines[1].replace(/.{0,2}$/, '…');
    lines.forEach((l, k) => { const t = mk('text', { x: n.x + W / 2, y: n.y + 20 + k * 12.5, 'text-anchor': 'middle', 'font-size': root ? 12 : 11, 'font-weight': 700,
      fill: root ? '#e5c07b' : '#f3ead2', 'font-family': 'Georgia,serif', 'letter-spacing': root ? 2 : 0.2 }, g); t.textContent = root ? l.toUpperCase() : l; });
    const sub = mk('text', { x: n.x + W / 2, y: n.y + 20 + lines.length * 12.5 + 3, 'text-anchor': 'middle', 'font-size': 9, fill: root ? '#f2dba6' : '#a7b0c2', 'font-style': root ? 'italic' : 'normal' }, g);
    sub.textContent = n.sub;
    if (n.kind !== 'claim' && !root) {
      // Bottom strip: share of the card's claims at each proof status.
      let x = n.x + 1; const total = n.claims.length;
      for (const s of ['refuted', 'untested', 'partial', 'proved']) { const k = n.claims.filter(c => c.status === s).length; if (!k) continue;
        const w = (W - 2) * k / total; mk('rect', { x, y: n.y + H - 7, width: w, height: 6, fill: scol(s) }, g); x += w; }
    }
    if (n.kind === 'chapter') { const t = mk('text', { x: n.x + W - 8, y: n.y + H - 12, 'text-anchor': 'end', 'font-size': 9.5, 'font-weight': 700, fill: '#e5c07b' }, g); t.textContent = open ? '▲ hide' : `▼ ${n.claims.length}`; }
    if (n.kind === 'claim' && n.claim.registry === 'production') { const t = mk('text', { x: n.x + W - 7, y: n.y + H - 7, 'text-anchor': 'end', 'font-size': 9, fill: '#6cc29a' }, g); t.textContent = '● live'; }
    const tl = document.createElementNS(NS, 'title'); tl.textContent = n.kind === 'claim' ? `${n.label} — ${STATUS[n.claim.status].label}` : `${n.label} — ${n.sub}`; g.appendChild(tl);
  }
  applyView();
}

/* ---- zoom & pan (same model as the problem graph) ---- */
const VIEW = { k: 1, tx: 0, ty: 0 }; let suppressClick = false;
const viewTransform = () => `translate(${VIEW.tx},${VIEW.ty}) scale(${VIEW.k})`;
function applyView() { const vp = $('viewport'); if (vp) vp.setAttribute('transform', viewTransform()); $('zoompct').textContent = Math.round(VIEW.k * 100) + '%'; }
const SW = () => WIDTH, SH = () => HEIGHT;
function svgPoint(e) { const r = $('graph').getBoundingClientRect(); return { x: (e.clientX - r.left) * SW() / r.width, y: (e.clientY - r.top) * SH() / r.height }; }
function zoomAt(px, py, f) { const k2 = Math.max(0.2, Math.min(5, VIEW.k * f)), r = k2 / VIEW.k; VIEW.tx = px - (px - VIEW.tx) * r; VIEW.ty = py - (py - VIEW.ty) * r; VIEW.k = k2; applyView(); }
function zoomStep(f) { zoomAt(SW() / 2, Math.min(SH(), 900) / 2, f); }
function resetView() { VIEW.k = 1; VIEW.tx = 0; VIEW.ty = 0; applyView(); }
function fitView() { VIEW.k = 1; VIEW.tx = 0; VIEW.ty = 0; applyView(); $('graphwrap').scrollIntoView({ behavior: 'smooth' }); }
(function initZoom() {
  const svg = $('graph');
  // Plain wheel scrolls the page; pinch (ctrlKey) or ⌘-wheel zooms.
  svg.addEventListener('wheel', e => { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); const p = svgPoint(e); zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  let drag = null;
  svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; });
  svg.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.moved > 4 && !suppressClick) { suppressClick = true; svg.setPointerCapture(e.pointerId); }
    if (!suppressClick) return; const r = svg.getBoundingClientRect(); VIEW.tx += dx * SW() / r.width; VIEW.ty += dy * SH() / r.height; drag.x = e.clientX; drag.y = e.clientY; applyView(); });
  const end = () => { drag = null; setTimeout(() => suppressClick = false, 50); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  document.addEventListener('keydown', e => { if (e.target.matches('input')) return;
    if (e.key === 'Escape') closeDrawer(); else if (e.key === '+' || e.key === '=') zoomStep(1.25); else if (e.key === '-') zoomStep(0.8); else if (e.key === '0' || e.key.toLowerCase() === 'f') fitView(); });
})();

/* ---- interaction ---- */
function setMode(m) { S.mode = m; $('m-thinker').classList.toggle('on', m === 'thinker'); $('m-date').classList.toggle('on', m === 'date');
  OPEN.clear(); TREE = buildTree(m); S.sel = null; closeDrawer(); draw(); }
function expandAll() { walk(TREE, n => n.kind === 'chapter' && OPEN.add(n.id)); draw(); }
function collapseAll() { OPEN.clear(); draw(); }
function walk(n, f) { f(n); n.children.forEach(c => walk(c, f)); }
function findNode(id) { let hit = null; walk(TREE, n => { if (n.id === id) hit = n; }); return hit; }
function parentOf(id) { let hit = null; walk(TREE, n => { if (n.children.some(c => c.id === id)) hit = n; }); return hit; }
function select(n) {
  if (n.kind === 'chapter') OPEN.has(n.id) && S.sel === n.id ? OPEN.delete(n.id) : OPEN.add(n.id);
  S.sel = n.id; draw(); openDrawer(n);
}
function selectClaim(id) {
  const n = findNode(`n:${id}`); if (!n) return;
  const p = parentOf(n.id); if (p?.kind === 'chapter') OPEN.add(p.id);
  S.sel = n.id; draw(); openDrawer(n);
  const r = $('graph').getBoundingClientRect(), scale = r.width / WIDTH;
  window.scrollTo({ top: window.scrollY + r.top + (n.y * VIEW.k + VIEW.ty) * scale - innerHeight / 2, behavior: 'smooth' });
}
$('search').addEventListener('input', e => {
  S.q = e.target.value.trim().toLowerCase();
  const n = S.q ? CLAIMS.filter(c => passes(c) && matches(c)).length : 0;
  $('searchinfo').textContent = S.q ? `${plural(n, 'match')}${n ? ' · Enter opens the first' : ''}` : '';
  draw();
});
$('search').addEventListener('keydown', e => { if (e.key === 'Enter') { const c = CLAIMS.find(c => passes(c) && matches(c)); if (c) selectClaim(c.id); } });

function setThresholds(p, t) {
  S.minP = +p; S.minT = +t; $('minP').value = S.minP; $('minT').value = S.minT;
  $('minPv').textContent = S.minP ? S.minP.toFixed(2) : 'any'; $('minTv').textContent = S.minT ? S.minT.toFixed(2) : 'any';
  $('clearthr').style.display = filtering() ? '' : 'none';
  TREE = buildTree(S.mode);
  if (S.sel && !findNode(S.sel)) { S.sel = null; $('drawer').style.display = 'none'; }
  const n = TREE.claims.length;
  $('shown').textContent = filtering() ? `${n} of ${CLAIMS.length} claims shown${S.minT ? ' · only Darwin has T scores so far' : ''}` : '';
  const q = new URLSearchParams(location.search); S.minP ? q.set('p', S.minP) : q.delete('p'); S.minT ? q.set('t', S.minT) : q.delete('t');
  history.replaceState(null, '', `${location.pathname}${q.size ? `?${q}` : ''}${location.hash}`);
  draw();
}
$('minP').addEventListener('input', e => setThresholds(e.target.value, S.minT));
$('minT').addEventListener('input', e => setThresholds(S.minP, e.target.value));

/* ---- inspector ---- */
const badge = (t, c) => `<span class="badge" style="background:${c}">${esc(t)}</span>`;
const num = (lab, v, col) => `<div class="num"><span class="l">${lab}</span><span class="bar"><i style="width:${v == null ? 0 : Math.round(v * 100)}%;background:${col}"></i></span><b>${fmt(v)}</b></div>`;
function npBlock(c) {
  if (c.registry === 'production') return `<a class="np" href="${esc(c.uri)}" target="_blank" rel="noopener"><b>Open the live nanopub ↗</b><br><span class="small mut">${esc(c.uri)}</span></a>`;
  if (c.registry === 'test') return `<a class="np" href="${esc(c.uri)}" target="_blank" rel="noopener"><b>Test-registry nanopub ↗</b> (not yet in production)</a>`;
  return `<div class="np"><b>Not published yet.</b> ${c.draft ? 'Draft extraction: its quote has not been verified against the source text yet.' : ''}</div>`;
}
function claimHtml(c) {
  const a = c.assess || [], t = c.truthBy || [];
  return `${badge(STATUS[c.status].label, scol(c.status))} ${c.draft ? '<span class="badge ghost">draft</span>' : ''}
  <h2>${esc(c.label)}</h2>
  <p class="small mut" style="margin:0">${esc(c.thinker)} · <i>${esc(c.work)}</i> (${c.year})${c.section && !c.section.startsWith(c.work) ? ` · ${esc(c.section)}` : ''}${c.locator ? ` · ${esc(c.locator)}` : ''}</p>
  ${npBlock(c)}
  <p>${esc(c.text)}</p>
  ${c.quote ? `<blockquote>“${esc(c.quote)}”</blockquote>` : ''}
  ${c.notation ? `<p><code>${esc(c.notation)}</code></p>` : ''}
  <h3>Edge scores</h3>
  ${num('<span class="pill pT">T</span> Testability', c.resolvability, '#e5c07b')}
  ${num('<span class="pill pP">P</span> Truth', c.truth, '#8fb7ff')}
  <p class="small mut">Testability: how far today's open datasets could confirm or refute the claim (rubric score, mean of ${a.length || 'no'} blind assessors). Truth: the assessors' probability that the claim, as stated, is true${t.length ? ` (mean of ${t.length})` : '; not scored yet'}.</p>
  ${t.length > 1 && Math.max(...t.map(x => x.p)) - Math.min(...t.map(x => x.p)) > 0.3 ? `<p class="small" style="color:#e8a64e">The assessors disagree on this claim's truth by more than 0.3; treat the mean with care.</p>` : ''}
  ${t.map(x => `<div class="assess"><b>${esc(x.who)}</b> · truth ${fmt(x.p)}<p>${esc(x.rationale)}</p></div>`).join('')}
  ${a.map(x => `<div class="assess"><b>${esc(x.who)}</b> · ${esc(x.verdict)} · testability ${fmt(x.overall)} · confidence ${fmt(x.confidence)}
    ${x.operationalization ? `<p>${esc(x.operationalization)}</p>` : ''}
    ${x.datasets.length ? `<p class="small">Datasets: ${x.datasets.map(d => `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.name)}</a>`).join(' · ')}</p>` : ''}</div>`).join('')}
  ${c.statusNote ? `<h3>Proof status</h3><p>${esc(c.statusNote)}</p>` : ''}
  ${c.test ? `<h3>Proposed test</h3><p>${esc(c.test)}</p>` : ''}
  ${c.doi ? `<p class="small">Source: <a href="https://doi.org/${esc(c.doi)}" target="_blank" rel="noopener">doi:${esc(c.doi)}</a></p>` : ''}
  ${c.scope ? `<h3>Scope</h3><p>${esc(c.scope)}</p>` : ''}`;
}
function listHtml(n) {
  const cs = filtering() ? n.claims.slice().sort((a, b) => (S.minT && !S.minP ? (b.resolvability ?? -1) - (a.resolvability ?? -1) : (b.truth ?? -1) - (a.truth ?? -1))) : n.claims;
  const by = s => cs.filter(c => c.status === s).length;
  return `<h2>${esc(n.kind === 'root' ? 'All claims' : n.label)}</h2><p class="small mut" style="margin:0">${esc(n.sub)} · ${cs.filter(c => c.registry === 'production').length} live · ${Object.keys(STATUS).filter(by).map(s => `${by(s)} ${STATUS[s].label.toLowerCase()}`).join(' · ')}</p>
  <h3>${plural(cs.length, 'claim')}</h3>` + cs.map(c => `<button class="clickable" onclick="selectClaim('${esc(c.id)}')"><i class="tri" style="background:${scol(c.status)};flex:none"></i>${esc(c.label)}<span class="r"><span class="pill pT">${fmt(c.resolvability)}</span><span class="pill pP">${fmt(c.truth)}</span></span></button>`).join('');
}
function openDrawer(n) {
  $('drawer').innerHTML = `<div style="display:flex;justify-content:flex-end"><button onclick="closeDrawer()">✕ Close</button></div>` + (n.kind === 'claim' ? claimHtml(n.claim) : listHtml(n));
  $('drawer').style.display = 'block'; $('drawer').scrollTop = 0;
}
function closeDrawer() { $('drawer').style.display = 'none'; if (S.sel) { S.sel = null; draw(); } }

{ const q = new URLSearchParams(location.search); setThresholds(q.get('p') || 0, q.get('t') || 0); if (q.get('claim')) selectClaim(q.get('claim')); }
</script></body></html>
