  function updateTuring(){const modes=M.modes(sim.length,sim.ratio),m=modes[sim.mode-1];$('#domain-length-value').textContent=sim.length.toFixed(1);$('#diffusion-ratio-value').textContent=sim.ratio+'×';$('#unstable-count').textContent=modes.filter(m=>m.unstable).length+' / 12';$('#growth-rate').textContent=(m.growth>0?'+':'')+m.growth.toFixed(3);$('#growth-rate').style.color=m.unstable?'#E58BA3':'#A3B0C2';$('#mode-status').textContent=m.unstable?'Growing mode':'Decaying mode';$('#mode-label').textContent='n = '+sim.mode;Array.from($('#mode-select').options).forEach((o,i)=>o.textContent='n = '+(i+1)+' · '+(modes[i].unstable?'growing':'decaying'));$('#mode-select').value=String(sim.mode);const mx=Math.max(...modes.map(m=>Math.abs(m.growth)),.1);$('#mode-bars').innerHTML=modes.map(m=>'<button class="mode-bar '+(m.unstable?'unstable ':'')+(m.n===sim.mode?'selected':'')+'" style="height:'+Math.max(5,Math.sqrt(Math.abs(m.growth)/mx)*70)+'px" data-mode="'+m.n+'" aria-label="Mode '+m.n+', growth rate '+m.growth.toFixed(3)+'" aria-pressed="'+(m.n===sim.mode)+'"><span class="bar-tip">λ '+m.growth.toFixed(3)+'</span><span class="bar-num">'+m.n+'</span></button>').join('');$$('[data-mode]').forEach(b=>b.onclick=()=>{sim.mode=+b.dataset.mode;updateTuring();});}
  const FISH_LAWS=[

  function fishGrounds(fish,current){
    const daane=(current.candidate||'').indexOf('daane')>=0;
    const outline=daane?'This outline follows Daane et al. 2021 Data S1A: pectoral length 107.5 mm on candidate fish3d-v3c-daane-length, with area scaled by the square of that length, and the pelvic fins inserted at 0.48 standard length.':'This outline follows Fish 1990 lengths and areas on candidate fish3d-v3a-fan, with the pelvic fins at 0.55 standard length.';
    const m=current.ballastedMassG,s=current.areaCm2,v=current.vTrimBallasted,allow=current.massFor8msG;
    const plugged=(m==null&&s==null)?'':'<br>This revision, ballasted: '+(m==null?'mass unstated':m.toFixed(1)+' g')+(s==null?'':', S = '+s.toFixed(1)+' cm²')+(v==null?'':' → '+v.toFixed(1)+' m/s');
    const laws=FISH_LAWS.map(fishLaw).filter(Boolean).map(law=>'<button class="claim-row" type="button" data-ground="'+esc(law.id)+'" data-ground-view="'+law.view+'"><span class="source">'+esc(law.source)+(law.year?' '+esc(law.year):'')+'</span><strong>'+esc(law.title)+'</strong><span class="row-status">'+esc(law.math)+(law.lean?' · Lean law':' · Source claim')+'</span></button><p class="small">'+esc(law.summary)+'</p><p class="small">'+esc(law.because)+'</p>').join('');
    return '<section class="panel outcomes grounds"><h3>The relation in the numbers</h3><div class="model-equation">V = √(2 m g / ρ S C_L)'+plugged+'</div><p class="small">Steady level lift, lift equal to weight. ρ = 1.225 kg/m³, C_L = 0.5, g = 9.81 m/s². The same balance is V = √(2 WL / ρ C_L), with wing loading WL = m g / S. Taxi, launch and ground effect sit outside it.</p><h3>Where the shape comes from</h3><p class="small">'+esc(outline)+'</p><p class="small">Fish 1990 measured wing loading from 11.7 to 208.9 N/m² on specimens of 0.003–0.53 kg, and relays that juveniles under 5 cm do not glide. Davenport 1992 reports swimming impaired beyond about 78–79% of standard length. A centre of gravity behind the pectoral fins is only a qualitative flag: no numeric centre of gravity was retrieved for a living flying fish. Park &amp; Choi 2010 discuss lift between the pectoral and pelvic fins, but camber was not taken from that paper, so these meshes are flat plates.</p><p class="small">Those ranges are measured bounds on preserved or reported fish, not a Lean law, and they were not remeasured on this mesh.</p><h3>Laws this design uses</h3>'+laws+outcome('Mass check',current.withinMassLimit?'Within limit':'Fails the hand limit','The hand requirement is V_trim ≤ 8 m/s at C_L 0.5. On 52.9 cm² that is '+(current.massLimitG==null?'10.5':current.massLimitG)+' g. On this area the same formula allows '+(allow==null?'an unstated mass':allow.toFixed(1)+' g')+'. Ballasted mass is '+(m==null?'unstated':m.toFixed(1)+' g')+'.','amber')+'<p class="small">'+(current.id==='r4-daane-printfix'?'r4 is a fit-and-balance prototype. Its right-hand print files are proper mirrors. It has not been printed or flown.':'r1 through r3 keep their recorded geometry. Their right-hand print files are known-defective mirrors.')+'</p>'+button('Save this revision','save-run',true,'check')+'</section>';
  }

  function enzymeTrack(){$('#track-content').innerHTML='<div class="studio-grid"><section class="panel control-panel"><h3>Darwin’s Bridge</h3><p>A retrospective experiment planner grounded in measured TrpB variants.</p><div class="parameter"><label>Measured variants</label><div style="font-size:28px;letter-spacing:-1px">159,129</div></div><div class="parameter"><label>Retrospective episodes</label><div style="font-size:28px;letter-spacing:-1px">2,500</div></div><div class="control-divider"></div><p>Three studies on a repeated-target panel. Five ESM2 model sizes evaluated on Nebius H100s.</p>'+button('Read the result','benchmark',false,'external')+'</section><section class="panel scene"><div class="panel-title"><h3>Certified episodes</h3><small>Reported 100-episode comparison</small></div><div class="scene-area"><div class="mini-bars"><div class="bench-row"><div class="bench-label"><span>LazySP-style baseline</span><strong>96<span style="font-size:12px;color:#A3B0C2"> / 100</span></strong></div><div class="bench-track"><div class="bench-fill" style="width:96%"></div></div></div><div class="bench-row"><div class="bench-label"><span>Model-assisted planner</span><strong>78<span style="font-size:12px;color:#A3B0C2"> / 100</span></strong></div><div class="bench-track"><div class="bench-fill pink" style="width:78%"></div></div></div><p class="bench-caption">The model-assisted planner did not improve certification in this reported comparison. The project found no foundation-model-prior benefit.</p></div></div><div class="scene-foot"><div><small>Evaluation type</small><strong style="font-size:13px">Retrospective</strong></div><div><small>Measured landscape</small><strong style="font-size:13px">TrpB variants</strong></div></div></section><section class="panel outcomes"><h3>A useful negative result</h3>'+outcome('Delivered','Systems prototype','Source-pinned claim adapters, conditional Lean routing and cut checks.','blue')+outcome('Finding','Baseline stronger','The comparison   function cellsTrack(){$('#track-content').innerHTML='<div class="studio-grid"><section class="panel control-panel"><h3>Reusable cell programs</h3><p>Run an illustrative kinetic program in a declared mathematical context.</p><div class="parameter"><label for="program-select">Program</label><select id="program-select"><option value="binding">Reversible binding</option><option value="activation">Activation / deactivation</option><option value="conversion">Saturable conversion</option></select></div>'+slider('kinetic-rate','Forward rate',sim.rate,.1,2,.05,'',['0.1','2.0'])+'<div class="control-divider"></div><div class="model-equation" id="kinetic-equation"></div><p>Normalized initial pools. Reverse rate = 0.15, or Kₘ = 0.3 for conversion. Parameters are illustrative, not fitted to A431 data.</p>'+button(sim.running?'Pause playback':'Play trajectories','toggle-motion',false,sim.running?'pause':'play')+'</section><section class="panel scene"><div class="panel-title"><h3>Program trajectories</h3><small>Illustrative numerical run</small></div><div class="scene-area"><div class="scene-status"><span class="tag">Synthetic kinetics</span><span>Normalized amount</span></div><canvas id="cells-canvas" role="img" aria-label="Line chart of two normalized pools under the selected kinetic program"></canvas><div class="scene-caption"><span style="color:#6D9BFF" id="pool-first">Free pool</span> &nbsp; <span style="color:#E58BA3" id="pool-second">Bound pool</span></div></div><div class="scene-foot"><div><small>Initial total</small><strong>1.00</strong></div><div><small>Product at t = 12</small><strong id="product-end"></strong></div><div><small>Project context</small><strong style="font-size:13px">EGFR → ERK / A431</strong></div></div></section><section class="panel outcomes"><h3>A program is a reusable unit</h3>'+outcome('Project deliverable','Executable','Three reusable kinetic programs applied to an EGFR to ERK subgraph in A431 cells.','blue')+outcome('Project result','Synthetic ru   document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&actions[b.dataset.action])actions[b.dataset.action]();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.dialog'))closeModal();if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!$('.dialog')){e.preventDefault();showSearch();}if(e.key==='Tab'&&$('.dialog')){const f=Array.from($('.dialog').querySelectorAll('button,a,input,select,[tabindex="0"]')).filter(el=>!el.disabled),first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  function applyLive(p){if(Array.isArray(p.claims)&&p.claims.length){D.claims=p.claims;if(!D.claims.some(c=>c.id===selected))selected=p.selected||D.claims[0].id;}if(Array.isArray(p.atlasIds))D.atlas=p.atlasIds.map(id=>D.claims.find(c=>c.id===id)).filter(Boolean);if(p.totals)D.totals=p.totals;if(p.repos)D.repos=p.repos;if(p.frontier)D.frontier=p.frontier;if(p.nanopubs)D.nanopubs=p.nanopubs;if(p.tracks)D.tracks=p.tracks;if(p.sources)D.sources=p.sources;if(Array.isArray(p.leanIds))D.leanIds=p.leanIds;if(p.date)D.date=p.date;if(p.source)D.source=p.source;D.live=true;const mode=document.getElementById('context-mode');if(mode)mode.innerHTML='<i class="live-dot"></i>Recorded claims';const date=document.getElementById('context-date');if(date)date.textContent='Through 31 Oct 2026';}
  async function boot(){const payload=await readJson(['/v1/product','data/product.json']);if(payload)applyLive(payload);render();}
  $('#global-search').onclick=showSearch;$('#about-snapshot').onclick=about;window.addEventListener('hashchange',render);boot();
})();
