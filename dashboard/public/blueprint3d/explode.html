  const inferred=(r.derived_expressed_in||r.derived_required_for)?{e:r.derived_expressed_in,r:r.derived_required_for}:null;return {rows,inferred,more};}

    <div class="sec"><h4>Anatomy behind it</h4><p class="small">The model's gills are four schematic arches per side (manifest: illustrative count). The blueprint has no gill, lamella or aorta node for Exocoetidae, which is why this zoom is drawn as a diagram rather than from a term.</p></div>
    <div class="sec"><h4>Basis</h4><ul class="t small"><li>flying-fish data: none</li><li>proxy teleost: the counter-current arrangement of water and blood in teleost gills (textbook physiology)</li><li>assumed: every number on the panel</li><li>${gill.sourced&&gill.sourced.solver?'solver from physiology/countercurrent.js':'solver: the page\'s own stand-in'}; ${gill.sourced&&gill.sourced.gills?'parameters from physiology/gills.json':'parameters: stand-in'}</li></ul></div>`;}
function physicsPanel(){$('#panel').innerHTML=`<h2>Physics: swim, taxi, glide</h2><p class="small">The physics thread's 2D side-view simulator of a flying fish swimming, taxiing, taking off and gliding, integrated from measured and labelled parameters; every number in it shows its source. It runs here inside the viewer, unchanged, from <span class="mono">t/physics/sim/</span>.</p>
    <div class="sec"><h4>Basis</h4><p class="small">Stated inside the simulator itself, per parameter (its params.json); the viz thread adds nothing to it. The 3D model's one evidence-backed proportion (pectoral fin length 0.687 of standard length) comes from the same Daane 2021 measurements the physics thread uses.</p></div>
    <p class="small"><a href="../t/physics/sim/" target="_blank" rel="noopener">Open the simulator on its own page</a> &middot; <a href="../t/physics/">physics thread page</a></p><p class="tiny">If the frame stays blank, the simulator page did not load; the link above opens it directly.</p>`;}
function drawInteractions(){const kind=state.mode;const svg=$('#isvg');const organ=state.organ&&term(state.organ)&&term(state.organ).level==='organ'?state.organ:FIN_ORGAN;const ot=term(organ);
  let nodes=[],caption='';
  if(kind==='tissue'){const F=FS();if(organ===FIN_ORGAN&&F){const ids=Object.keys(F.nodes).filter(k=>['part','precursor','precursor part'].includes(F.nodes[k].level));nodes=ids.map(k=>({id:k,label:F.nodes[k].label||k,hasRec:hasRec(k)}));caption=`${ot.label}: ${nodes.length} tissues and bud parts from genotype/fin-subtree.json (zebrafish anatomy)`;}
    else{const ids=(children.get(organ)||[]).filter(k=>term(k)&&term(k).level==='tissue');nodes=ids.map(k=>({id:k,label:term(k).label,hasRec:hasRec(k)}));caption=`${ot.label}: ${nodes.length} tissues from the blueprint`;}}
  else{const F=FS();if(organ===FIN_ORGAN&&F){const ids=Object.keys(F.nodes).filter(k=>F.nodes[k].level==='cell');nodes=ids.map(k=>({id:k,label:F.nodes[k].label||k,hasRec:hasRec(k)}));caption=`${ot.label}: ${nodes.length} post-composed cell types from genotype/fin-subtree.json`;}
    else{const ids=(children.get(organ)||[]).filter(k=>term(k)&&term(k).level==='cell');nodes=ids.map(k=>({id:k,label:term(k).label,hasRec:hasRec(k)}));caption=`${ot.label}: ${nodes.length} cell types the blueprint places under the organ`;}}
  const allLinks=(kind==='tissue'?interData.tissue:interData.cell);const links=allLinks.filter(l=>l.context===ctx);const otherCtx=allLinks.length-links.length;
  const res=drawInteractionGraph(svg,nodes,links,{kind,caption:caption+(interData.source==='pending'?' · interactions: pending':` · ${links.length} ${ctx} interactions from ${interData.source}`),onPick:id=>{state.tissue=id;show(id);},onLink:(l,a,b)=>interactionPanel(l,a,b)});
  interactionPanel(null,null,null,{organ:ot,kind,nodes:nodes.length,drawn:res.drawn,unmatched:res.unmatched,otherCtx,total:allLinks.length});}
function interactionPanel(l,a,b,cx){
  if(l){const GW={mechanism:'mechanism shown',sufficiency:'sufficiency shown',necessity:'necessity shown (loss of function)',association:'association only',hypothesis:'hypothesis, not shown'};
    $('#panel').innerHTML=`<h2>${esc(a.label)} \u2192 ${esc(b.label)}</h2><div><span class="chip ${l.grade==='hypothesis'||l.grade==='association'?'warn':'ok'}">${esc(GW[l.grade]||l.grade)}</span><span class="chip">${esc(l.context)}</span>${l.orthology?`<span class="chip warn">inferred by orthology${l.orthologySpecies?' from '+esc(l.orthologySpecies):''}</span>`:'<span class="chip ok">direct evidence in the stated organism</span>'}${l.organism?`<span class="chip">${esc(l.organism)}</span>`:''}${l.kind?`<span class="chip">${esc(l.kind)}</span>`:''}</div>
      ${l.flags.length?`<div class="prov model"><b>Validator flags (drawn weaker)</b><ul class="t small">${l.flags.map(f=>`<li>${esc(typeof f==='string'?f:JSON.stringify(f))}</li>`).join('')}</ul></div>`:''}
      ${l.ligands.length||l.receptors.length||l.channels.length?`<div class="sec"><h4>Molecules</h4><p class="small">${l.ligands.length?'ligands: '+l.ligands.map(g=>`<span class="gene" data-g="${esc(g)}">${esc(g)}</span>`).join('')+' ':''}${l.receptors.length?'receptors: '+l.receptors.map(g=>`<span class="gene R" data-g="${esc(g)}">${esc(g)}</span>`).join('')+' ':''}${l.channels.length?'channels: '+l.channels.map(g=>`<span class="gene S" data-g="${esc(g)}">${esc(g)}</span>`).join(''):''}</p></div>`:''}
      ${l.genes.length?`<div class="sec"><h4>Genes</h4><div>${l.genes.map(g=>`<span class="gene" data-g="${esc(g)}">${esc(g)}</span>`).join('')}</div></div>`:''}${l.note?`<p class="small">${esc(l.note)}</p>`:''}
      <div class="sec"><h4>Sources (${l.sources.length})</h4>${l.sources.length?`<ul class="t small">${l.sources.map(sr=>`<li>${sr.url?`<a href="${esc(sr.url)}" target="_blank" rel="noopener">${esc(sr.ref||sr.url)}</a>`:esc(sr.ref||'unreferenced')}${sr.organism?' <span class="tiny">'+esc(sr.organism)+'</span>':''}${sr.quote?`<blockquote class="small" style="margin:.3em 0;border-left:3px solid var(--line);padding-left:8px">${esc(sr.quote)}</blockquote>`:' <span class="tiny">(no verbatim quote)</span>'}</li>`).join('')}</ul>`:'<p class="small">no source given in interactions.json</p>'}</div>
      <p class="tiny">From ${esc(interData.source)}${interData.built?', built '+esc(interData.built):''}. ${esc(interData.organism_note||'')} Click a molecule to tint every piece its gene touches.</p>`;
    $$('[data-g]').forEach(x=>x.onclick=()=>{setMode('anatomy');lens(x.dataset.g);});return;}
  const c=cx;$('#panel').innerHTML=`<h2>${c.kind==='tissue'?'Tissue signalling':'Cell-cell interactions'}: ${esc(c.organ.label)}</h2>
    <p class="small">${c.kind==='tissue'?'Arrows are signalling from one tissue to another (for the fin bud: apical ectodermal ridge, mesoderm, zone of polarizing activity, fin fold), each labelled with its genes and clickable to its source.':'Glyphs are cell types; links are ligand-receptor pairs or gap junctions, each with its source and evidence grade.'} Solid dark arrows: direct evidence in the stated organism, thicker for a stronger grade. Dashed grey arrows: inferred by orthology from human or mouse. Dotted light arrows: kept but flagged by the validator (a step without a source or quote).</p>
    ${interData.source==='pending'?`<div class="prov model"><b>Pending</b><span class="small">${esc(interData.note)}</span></div>`:!interData.all.length?`<div class="prov model"><b>genotype/interactions.json is present${interData.built?' (built '+esc(interData.built)+')':''} but holds no interaction yet</b><span class="small">Its subagents are still running; nothing is drawn because nothing is sourced. ${esc(interData.note||'')}</span>${interData.validation_flags&&Object.keys(interData.validation_flags).length?`<p class="tiny">Validator flags so far: ${Object.entries(interData.validation_flags).map(([k,v])=>`${esc(k)} ×${v}`).join('; ')}</p>`:''}${interData.gaps.length?`<p class="tiny">Gaps recorded: ${interData.gaps.map(g=>esc(typeof g==='string'?g:JSON.stringify(g))).join('; ')}</p>`:''}</div>`:`<p class="small">Context <b>${esc(ctx)}</b>: ${c.drawn} interaction${c.drawn===1?'':'s'} drawn${c.unmatched?`; ${c.unmatched} rows name tissues or cells not among these ${c.nodes} nodes`:''}${c.otherCtx?`; ${c.otherCtx} more in other contexts (pick them from the context menu; contexts are never merged)`:''}. Line weight = grade (mechanism &gt; sufficiency &gt; necessity &gt; association &gt; hypothesis); dashed grey = inferred by orthology; dotted light = flagged by the validator. ${interData.flagged?interData.flagged+' flagged, ':''}${interData.orthology} orthology-inferred of ${interData.all.length} in the file${interData.vetted?' (vetted)':''}. Source ${esc(interData.source)}${interData.built?', built '+esc(interData.built):''}. ${esc(interData.note||'')}</p>${interData.refuted.length?`<details><summary>Refuted or unsupported (${interData.refuted.length})</summary><ul class="t small">${interData.refuted.map(r=>`<li>${esc(typeof r==='string'?r:(r.claim||r.statement||JSON.stringify(r)))}</li>`).join('')}</ul></details>`:''}${interData.gaps.length?`<details><summary>Gaps (${interData.gaps.length})</summary><ul class="t small">${interData.gaps.map(g=>`<li>${esc(typeof g==='string'?g:JSON.stringify(g))}</li>`).join('')}</ul></details>`:''}`}
    <p class="tiny">Pick another organ from the dropdown to change the set; click a node for its genes and provenance. Hollow glyph: no gene record (unstudied, not gene-free).</p>`;}
// ---------- boot ----------
Promise.all([fetch('data.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}),loadModel()]).then(([d,sc])=>{D=d;init(sc);}).catch(e=>{$('#panel').innerHTML='<h2>The view failed to load</h2><p class="small">'+esc(e.message)+'</p>';console.error(e);});
function init(sc){
  for(const t of D.terms)T.set(t.id,t);
  for(const t of D.terms){for(const p of t.parents){if(!children.has(p.id))children.set(p.id,[]);children.get(p.id).push(t.id);}}
  G=D.genotype&&!D.genotype.gated&&!D.genotype.error&&D.genotype.nodes?D.genotype:null;
  const sel=$('#organSel');for(const o of D.terms.filter(t=>t.level==='organ').sort((a,b)=>a.label.localeCompare(b.label))){const op=document.createElement('option');op.value=o.id;op.textContent=o.label+(hasRec(o.id)?'':' (no gene record)');sel.appendChild(op);}
  sel.onchange=()=>{if(!sel.value)return;if(state.mode==='tissue'||state.mode==='cell'){state.organ=sel.value;drawInteractions();}else goOrgan(sel.value);};
  const dl=$('#geneList');if(G){for(const s of Object.keys(G.gene_index||{}).sort()){const op=document.createElement('option');op.value=s;dl.appendChild(op);}}
  $('#geneQ').onchange=e=>{const q=e.target.value.trim();if(q)lens(q);};$('#geneQ').onkeydown=e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q)lens(q);}};
  $('#split').oninput=e=>{state.split=+e.target.value/100;applyState();};$('#peel').oninput=e=>{state.peel=+e.target.value;applyState();};$('#split').onchange=$('#peel').onchange=()=>fitView(true);
  $$('#stages button[data-s]').forEach(b=>b.onclick=()=>{collapseNote();setStage(+b.dataset.s);});
  $('#modeSel').onchange=e=>{collapseNote();setMode(e.target.value);};$('#ctxSel').onchange=e=>{ctx=e.target.value;drawInteractions();};$('#intensity').oninput=e=>{intensity=+e.target.value/100;applyCardiac();if(circData)basisBox();};$('#gillBtn').onclick=openGill;$('#gillClose').onclick=()=>{$('#physio').style.display='none';physioPanel();};
  $('#ccBtn').onclick=()=>{gill.counter=true;$('#ccBtn').classList.add('primary');$('#coBtn').classList.remove('primary');gillPanel();};$('#coBtn').onclick=()=>{gill.counter=false;$('#coBtn').classList.add('primary');$('#ccBtn').classList.remove('primary');gillPanel();};$('#playBtn').onclick=()=>{gill.playing=!gill.playing;if(circ)circ.playing=gill.playing;$('#playBtn').textContent=gill.playing?'pause':'play';};
  $('#gillBtn').style.display='none';$('#wingBtn').onclick=()=>wing();$('#resetBtn').onclick=reset;
  build(sc);legend();
  if(params.get('split')){state.split=Math.max(0,Math.min(1,+params.get('split')));$('#split').value=state.split*100;}
  if(params.get('peel')){state.peel=Math.max(0,Math.min(3,+params.get('peel')));$('#peel').value=state.peel;}
  if(params.get('stage'))setStage(Math.max(0,Math.min(4,+params.get('stage'))));
  if(params.get('spin')==='0')spin=false;
  if(params.get('part')&&objs.some(o=>o.name===params.get('part')))state.obj=params.get('part');
  if(params.get('organ')&&term(params.get('organ')))goOrgan(params.get('organ'),true);
  if(params.get('preset')==='wing')wing(true);
  if(params.get('tissue')&&term(params.get('tissue')))state.tissue=params.get('tissue');
  if(['stage','organ','part','preset','gene','split','peel','tissue'].some(k=>params.get(k)))collapseNote();
  applyState();if(!userMoved&&state.split>0.3)cam.phi=0.95;fitView(false);
  if(params.get('gene'))lens(params.get('gene'),true);
  else if(state.tissue)show(state.tissue);else if(state.organ)show(state.organ);else if(state.obj)selectObj(state.obj);else intro();
  if(params.get('context')&&CONTEXTS.includes(params.get('context'))){ctx=params.get('context');$('#ctxSel').value=ctx;}
  const mode=params.get('mode');if(mode&&['physiology','tissue','cell','physics'].includes(mode)){collapseNote();setMode(mode);if(mode==='physiology'&&params.get('gill')==='1')setTimeout(openGill,800);}
}
