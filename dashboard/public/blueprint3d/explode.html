<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Inter Tight",system-ui,sans-serif;display:flex;flex-direction:column}
a{color:var(--accent)}

a.go{cursor:pointer}
.prov{border-left:3px solid var(--accent);padding:4px 10px;margin:6px 0}

.rung.broken{background:color-mix(in srgb,var(--warn) 10%,transparent);border-left:3px solid var(--warn);margin-left:-15px;padding-left:12px}.rung.broken .rn{background:var(--warn)}

.rh{margin-bottom:3px}
#modeSel{font-weight:600}

#compare .cmpbar{position:absolute;left:8px;right:8px;bottom:8px;height:88px;align-content:flex-end;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.78rem}
#compare .cmpbar label{display:inline-flex;gap:6px;align-items:center}
@media (max-width:880px){#compare .cmpgrid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1.1fr;grid-template-areas:"a b" "d c" "e e";bottom:124px}#compare .cmpr .tiny{display:none}#compare .cmpbar{height:112px;font-size:.7rem}#compare .cmph{font-size:.68rem;padding:2px 6px}#compare .cmpl{font-size:.62rem}#compare .cmpr{font-size:.64rem}}
#seqv{position:absolute;inset:0;z-index:6;display:none;background:var(--surface);overflow:auto;padding:10px 12px 60px;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}

#seqv .sqtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}#seqv .sqtabs button.on{border-color:var(--accent);color:var(--accent);font-weight:600}

<body>
<header>
  <b>Open the Fish</b>
  <nav><a href="../start/">Start</a><a href="../">Mission Control</a><a href="./?view=radial">Radial 3D view</a><a href="../graph/?view=flyingfish">Graph</a><a href="../t/genotype/">Genotype thread</a><a href="../t/lean/index.html#blueprint">Lean certificate</a></nav>
  <div class="ctl">
    <select id="modeSel" title="What to show"><option value="anatomy">Anatomy</option><option value="physiology">Physiology: circulation and gills</option><option value="tissue">Tissue signalling</option><option value="cell">Cell-cell interactions</option><option value="physics">Physics: flight simulator</option><option value="design">Design Studio</option><option value="sequences">Sequences</option><option value="compare">Compare: 2×2 + TFF</option><option value="growth">Growth</option></select>
    <label title="Split the fish along the midline and swing the halves apart">split <input type="range" id="split" min="0" max="100" value="0"></label>
    <label title="Peel the layers from the outside in: skin, then muscle, then the skeleton, leaving the organs">peel <input type="range" id="peel" min="0" max="3" value="0" step="1"></label>
    <select id="organSel" title="Open an organ's panel"><option value="">organ&hellip;</option></select>
    <label id="intLab" title="Swimming intensity: rest to maximum; scales heart rate between the proxy's resting and maximal values" style="display:none">effort <input type="range" id="intensity" min="0" max="100" value="0"></label>
    <select id="ctxSel" title="Interaction context: never merged" style="display:none"><option value="development">development</option><option value="regeneration">regeneration</option><option value="adult">adult</option></select>
    <input type="search" id="geneQ" list="geneList" placeholder="gene lens: symbol&hellip;" title="Tint every part a gene touches"><datalist id="geneList"></datalist>
    <button id="wingBtn" class="primary" title="Pectoral fin with the fin-size genes pinned">Wing genes</button>
    <button id="resetBtn">Reset</button>
    <button id="themeBtn">Theme</button>
  </div>
</header>

  <div id="stage">
    <canvas id="c"></canvas>
    <svg id="leaders"></svg>
    <div id="labels"></div>
    <div id="tip"></div>
    <div id="note" class="ov"></div>
    <div id="crumbs" class="ov"></div>
    <div id="legend" class="ov"></div>
    <div id="inset" class="ov"></div>
    <svg id="isvg"></svg>
    <div id="banner"></div><div id="compare"></div><div id="seqv"></div>
    <div id="studio" class="ov"></div>
    <div id="hlabel"></div>
    <div id="growth"><div class="bar"><button id="gPlay">play</button><select id="gSpeed"><option value="1">1 day / s</option><option value="7" selected>1 week / s</option><option value="30">1 month / s</option><option value="365">1 year / s</option></select><input type="range" id="gAge" min="0" max="1095" value="0"><span id="gRead" class="tiny"></span></div><canvas id="gC"></canvas></div>

    <div id="basis" class="ov"></div>

  </div>

function applyDesignToModel(d){const b=baseDesign;const fl=d.finLen/b.finLen,sp=Math.sqrt(d.finSpan),sl=d.SL/b.SL,lobe=d.lowerLobe/b.lowerLobe;

  $('#gillBtn').style.display='none';$('#wingBtn').onclick=()=>wing();$('#resetBtn').onclick=reset;
  build(sc);legend();
  if(params.get('split')){state.split=Math.max(0,Math.min(1,+params.get('split')));$('#split').value=state.split*100;}
  if(params.get('peel')){state.peel=Math.max(0,Math.min(3,+params.get('peel')));$('#peel').value=state.peel;}
  if(params.get('stage'))setStage(Math.max(0,Math.min(4,+params.get('stage'))));
  if(params.get('spin')==='0')spin=false;
  if(params.get('part')&&objs.some(o=>o.name===params.get('part')))state.obj=params.get('part');
  if(params.get('organ')&&term(params.get('organ')))goOrgan(params.get('organ'),true);
  if(params.get('preset')==='wing')wing(true);
  if(params.get('tissue')&&term(params.get('tissue')))state.tissue=params.get('tissue');
  if(['stage','organ','part','preset','gene','split','peel','tissue'].some(k=>params.get(k)))collapseNote();
  applyState();if(!userMoved&&state.split>0.3)cam.phi=0.95;fitView(false);
  if(params.get('gene'))lens(params.get('gene'),true);
  else if(state.tissue)show(state.tissue);else if(state.organ)show(state.organ);else if(state.obj)selectObj(state.obj);else intro();
  if(params.get('context')&&CONTEXTS.includes(params.get('context'))){ctx=params.get('context');$('#ctxSel').value=ctx;}
  const mode=params.get('mode');if(mode&&['physiology','tissue','cell','physics','design','growth','compare','sequences'].includes(mode)){collapseNote();setMode(mode);if(mode==='physiology'&&params.get('gill')==='1')setTimeout(openGill,800);}
}
</script>
</body>
