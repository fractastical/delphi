<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint in 3D &mdash; DELPHI</title>
<meta name="description" content="The flying-fish blueprint as a 3D projection of its ontology hierarchy: every node with its term, the query that produced it, and the Lean certificate that covers it.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e7c86'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3Ccircle cx='7' cy='9' r='2.2' fill='white'/%3E%3Ccircle cx='25' cy='8' r='2.2' fill='white'/%3E%3Ccircle cx='24' cy='25' r='2.2' fill='white'/%3E%3Ccircle cx='8' cy='24' r='2.2' fill='white'/%3E%3Cpath d='M16 16L7 9M16 16L25 8M16 16L24 25M16 16L8 24' stroke='white' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--panel:#fff;--ink:#14201f;--mute:#5a6b69;--line:#d9dfdb;--accent:#0e7c86;--soft:#eef2ef;--surface:#fcfcfb;
 --ok:#2f7d4f;--bad:#b3392f;--warn:#a8650b;
 /* one hue, light to dark with depth: body, organ system, organ, tissue, cell type */
 --l0:#a6dde4;--l1:#5fc3cd;--l2:#139aab;--l3:#0c6f7c;--l4:#073f47;
 --gene:#eb6834;--edge:#9aa6a3;--edge2:#c7cfcc;--named:#14201f}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--bg:#0d1514;--panel:#142120;--ink:#e7efec;--mute:#93a6a2;--line:#27403d;--accent:#38b6c1;--soft:#192b29;--surface:#1a1a19;
 --ok:#58c07f;--bad:#ef7a6e;--warn:#e0a24a;
 --l0:#0d4a52;--l1:#167886;--l2:#22a3b3;--l3:#6fcbd6;--l4:#b5e6ec;
 --gene:#d95926;--edge:#6b7b78;--edge2:#3a4a47;--named:#e7efec}}
:root[data-theme="dark"]{--bg:#0d1514;--panel:#142120;--ink:#e7efec;--mute:#93a6a2;--line:#27403d;--accent:#38b6c1;--soft:#192b29;--surface:#1a1a19;
 --ok:#58c07f;--bad:#ef7a6e;--warn:#e0a24a;
 --l0:#0d4a52;--l1:#167886;--l2:#22a3b3;--l3:#6fcbd6;--l4:#b5e6ec;
 --gene:#d95926;--edge:#6b7b78;--edge2:#3a4a47;--named:#e7efec}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Inter Tight",system-ui,sans-serif;display:flex;flex-direction:column}
a{color:var(--accent)}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header b{font-family:Fraunces,serif;font-size:1.1rem}
nav a{padding:3px 9px;border-radius:99px;text-decoration:none;color:var(--mute);font-size:.86rem}
nav a:hover{background:var(--soft);color:var(--ink)}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.84rem;margin-left:auto}
.ctl label{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:2px 9px;cursor:pointer;background:var(--panel)}
.ctl input[type=checkbox]{margin:0}
select,input[type=search],button{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 9px}
button{cursor:pointer}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
@media (max-width:880px){main{grid-template-columns:1fr;grid-template-rows:62vh auto}}
#stage{position:relative;min-height:0;min-width:0;overflow:hidden;background:var(--surface)}
#c{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels div{position:absolute;transform:translate(6px,-50%);font-size:11px;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 2px var(--surface)}
#labels div.sys{font-weight:700;font-size:12px}
#labels div.hl{font-weight:700;color:var(--accent)}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.8rem;display:none;max-width:260px;z-index:3}
.ov{position:absolute;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.78rem;z-index:2}
#note{left:10px;top:10px;max-width:330px;color:var(--ink);font-size:.74rem;line-height:1.35}
#note b.h{display:block;font-size:.78rem}
#stats{right:10px;top:10px;color:var(--mute);padding:4px 8px}
#legend{left:10px;bottom:10px;max-width:330px}
#legend .row{display:flex;gap:7px;align-items:center;margin:2px 0}
#legend .sw{display:inline-block;border-radius:50%;flex:none}
#legend .ln{display:inline-block;width:18px;height:0;border-top:2px solid var(--edge);flex:none}
#legend .ln.alt{border-top-style:dashed}
#legend .gm{display:inline-block;width:10px;height:10px;transform:rotate(45deg);background:var(--gene);flex:none}
#cert{right:10px;bottom:10px;max-width:330px}
.card{border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin:5px 0}
.card.struct{border-color:var(--accent);border-width:2px}
.card.bio{border-style:dashed;color:var(--mute)}
.card b{display:block;font-size:.8rem;color:var(--ink)}
#panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px}
#panel h2{font-family:Fraunces,serif;font-size:1.15rem;margin:0 0 6px;line-height:1.2}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.75rem;border:1px solid var(--line);background:var(--soft);color:var(--mute);margin:0 4px 4px 0}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.warn{color:var(--warn);border-color:var(--warn)}.chip.acc{color:var(--accent);border-color:var(--accent)}
.sec{margin:12px 0}
.sec h4{margin:0 0 4px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.small{font-size:.86rem}.tiny{font-size:.77rem;color:var(--mute)}
.mono{font-family:"JetBrains Mono",monospace;font-size:.77rem;background:var(--soft);padding:1px 5px;border-radius:4px;word-break:break-all}
pre{font-family:"JetBrains Mono",monospace;font-size:.7rem;white-space:pre-wrap;word-break:break-all;background:var(--soft);padding:8px;border-radius:6px;max-height:260px;overflow:auto;margin:4px 0}
ul.t{margin:.2em 0;padding-left:1.1em}ul.t li{margin:.25em 0}
details{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0}
details summary{cursor:pointer;font-size:.86rem;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:.8rem}td,th{text-align:left;padding:3px 5px;border-bottom:1px solid var(--line);vertical-align:top}
a.go{cursor:pointer}
body.embed header,body.embed #panel{display:none}
body.embed main{grid-template-columns:1fr}
</style>
</head>
<body>
<header>
  <b>Blueprint in 3D</b>
  <nav><a href="../start/">Start</a><a href="../">Mission Control</a><a href="explode">Open the fish (default)</a><a href="../graph/?view=flyingfish">Graph</a><a href="../t/organism/">Organism thread</a><a href="../t/lean/index.html#blueprint">Lean certificate</a></nav>
  <div class="ctl">
    <label><input type="checkbox" id="showTissue" checked>tissues</label>
    <label><input type="checkbox" id="showCell" checked>cell types</label>
    <label><input type="checkbox" id="showGenes" checked>genes</label>
    <label><input type="checkbox" id="spin" checked>spin</label>
    <input type="search" id="q" placeholder="find a structure&hellip;">
    <button id="resetBtn" title="Reset the camera">Reset view</button>
    <button id="pngBtn" title="Save the current view as a PNG">PNG</button>
    <button id="svgBtn" title="Save the current view as an SVG (vector)">SVG</button>
    <button id="themeBtn">Theme</button>
  </div>
</header>
<main>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div id="tip"></div>
    <div id="note" class="ov"></div>
    <div id="stats" class="ov"></div>
    <div id="legend" class="ov"></div>
    <div id="cert" class="ov"></div>
  </div>
  <aside id="panel"><h2>Loading the blueprint&hellip;</h2></aside>
</main>
<script>/* Open the Fish (explode) is the default blueprint page (Amit, 2026-10-31); the radial view stays at ?view=radial, and ?find= still opens it. */(function(){var q=new URLSearchParams(location.search);if(q.get('view')!=='radial'&&!q.has('find')){q.delete('view');var s=q.toString();location.replace('explode'+(s?'?'+s:''));}})();</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);
if(params.get('embed')==='1')document.body.classList.add('embed');
const tk='delphi-theme';
try{if(localStorage.getItem(tk))document.documentElement.dataset.theme=localStorage.getItem(tk);}catch{}
if(params.get('theme'))document.documentElement.dataset.theme=params.get('theme');

// Colours are read once into PAL and refreshed on a theme change; never per node per frame.
let PAL={};
function readPalette(){const cs=getComputedStyle(document.documentElement);
  ['--l0','--l1','--l2','--l3','--l4','--gene','--edge','--edge2','--named','--surface','--accent','--ink','--mute','--panel'].forEach(k=>PAL[k]=cs.getPropertyValue(k).trim());}
readPalette();
const LEVELS=['body','organ_system','organ','tissue','cell'];
const LEVEL_NAME={body:'body',organ_system:'organ system',organ:'organ',tissue:'tissue',cell:'cell type'};
const RADIUS={body:0,organ_system:34,organ:58,tissue:78,cell:95};
const SIZE={body:4.2,organ_system:2.5,organ:1.6,tissue:0.95,cell:0.7};
const levelColor=l=>PAL['--l'+LEVELS.indexOf(l)];

let D=null, T=new Map(), children=new Map(), pos=new Map(), genesByNode=new Map();
if(!window.THREE){$('#panel').innerHTML='<h2>three.js did not load</h2><p class="small">The 3D library is fetched from cdnjs; without it this page cannot draw. The data is still at <a href="data.json">data.json</a>.</p>';return;}
fetch('data.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(d=>{D=d;try{build();}catch(e){$('#panel').innerHTML='<h2>The blueprint failed to draw</h2><p class="small">'+esc(e.message)+'</p>';console.error(e);}})
  .catch(e=>{$('#panel').innerHTML='<h2>Could not load data.json</h2><p class="small">'+esc(e.message)+'</p>';});

// ---------- layout: a projection of the ontology hierarchy. Not anatomy, not geometry. ----------
// Each node gets a direction on the unit sphere and a cone half-angle; its children sit on a ring
// inside that cone at the next level's radius. A term placed under several wholes is drawn once,
// under the first whole the file lists; its other placements are drawn as second-placement edges.
function layout(){
  for(const t of D.terms){T.set(t.id,t);}
  for(const t of D.terms){const p=t.parents[0];if(p){if(!children.has(p.id))children.set(p.id,[]);children.get(p.id).push(t.id);}}
  const root=D.terms.find(t=>t.level==='body');
  pos.set(root.id,{v:new THREE.Vector3(0,0,0),dir:new THREE.Vector3(0,1,0),th:Math.PI});
  const fib=(i,n)=>{const y=1-2*(i+0.5)/n,r=Math.sqrt(1-y*y),a=i*2.399963;return new THREE.Vector3(r*Math.cos(a),y,r*Math.sin(a));};
  const sys=(children.get(root.id)||[]).map(id=>T.get(id)).sort((a,b)=>a.label.localeCompare(b.label));
  const thSys=0.5*Math.sqrt(4*Math.PI/Math.max(sys.length,1));
  sys.forEach((s,i)=>{const d=fib(i,sys.length);pos.set(s.id,{v:d.clone().multiplyScalar(RADIUS.organ_system),dir:d,th:thSys});});
  const ring=(parentId,ids,radius,phase)=>{
    const P=pos.get(parentId); if(!P||!ids.length)return;
    const k=ids.length, alpha=k===1?0:P.th*0.62;
    const u=new THREE.Vector3(0,1,0); if(Math.abs(P.dir.dot(u))>0.9)u.set(1,0,0);
    const e1=new THREE.Vector3().crossVectors(P.dir,u).normalize(), e2=new THREE.Vector3().crossVectors(P.dir,e1).normalize();
    ids.forEach((id,i)=>{const az=phase+2*Math.PI*i/k;
      const d=P.dir.clone().multiplyScalar(Math.cos(alpha)).addScaledVector(e1,Math.sin(alpha)*Math.cos(az)).addScaledVector(e2,Math.sin(alpha)*Math.sin(az)).normalize();
      const th=k===1?P.th*0.8:Math.max(0.03,Math.min(P.th*0.45,Math.PI*Math.sin(alpha)/k*0.9));
      pos.set(id,{v:d.clone().multiplyScalar(radius),dir:d,th});});
  };
  for(const s of sys){const org=(children.get(s.id)||[]).map(id=>T.get(id)).sort((a,b)=>(b.major_organ?1:0)-(a.major_organ?1:0)||a.label.localeCompare(b.label)).map(t=>t.id);ring(s.id,org,RADIUS.organ,0);}
  for(const t of D.terms){if(t.level!=='organ')continue;const kids=(children.get(t.id)||[]).map(id=>T.get(id));
    ring(t.id,kids.filter(k=>k.level==='tissue').map(k=>k.id),RADIUS.tissue,0.4);
    ring(t.id,kids.filter(k=>k.level==='cell').map(k=>k.id),RADIUS.cell,0.1);}
  // anything the rules above did not place (should be nothing) goes near its first parent, and is counted
  let unplaced=0; for(const t of D.terms){if(!pos.has(t.id)){unplaced++;const p=pos.get(t.parents[0]?.id)||pos.get(root.id);pos.set(t.id,{v:p.v.clone().addScaledVector(p.dir,8),dir:p.dir,th:0.05});}}
  return unplaced;
}

// ---------- scene ----------
let renderer,scene,camera,inst,lines,lines2,hiLines,geneInst,geneLines,namedRings=[],ids=[],idIndex=new Map(),geneIds=[];
let sel=null,hover=null,spin=true,userMoved=false;
const cam={theta:0.6,phi:1.15,dist:250,target:new THREE.Vector3()};
function build(){
  const unplaced=layout();
  const el=$('#c');
  renderer=new THREE.WebGLRenderer({canvas:el,antialias:true,alpha:true,preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(42,1,1,2000);
  scene.add(new THREE.AmbientLight(0xffffff,0.75));
  const dl=new THREE.DirectionalLight(0xffffff,0.9);dl.position.set(1,1.4,0.8);scene.add(dl);
  const dl2=new THREE.DirectionalLight(0xffffff,0.35);dl2.position.set(-1,-0.5,-0.8);scene.add(dl2);

  ids=D.terms.map(t=>t.id); ids.forEach((id,i)=>idIndex.set(id,i));
  inst=new THREE.InstancedMesh(new THREE.SphereGeometry(1,14,10),new THREE.MeshLambertMaterial({}),ids.length);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(inst);
  // first-placement edges and second-placement edges, separately coloured
  const e1=[],e2=[]; for(const e of D.edges){const t=T.get(e.part);const first=t.parents[0]&&t.parents[0].id===e.whole;(first?e1:e2).push(e);}
  const mk=(arr,op)=>{const g=new THREE.BufferGeometry();const a=new Float32Array(arr.length*6);arr.forEach((e,i)=>{const p=pos.get(e.part).v,w=pos.get(e.whole).v;a.set([p.x,p.y,p.z,w.x,w.y,w.z],i*6);});
    g.setAttribute('position',new THREE.BufferAttribute(a,3));const m=new THREE.LineBasicMaterial({transparent:true,opacity:op});const L=new THREE.LineSegments(g,m);L.userData.edges=arr;scene.add(L);return L;};
  lines=mk(e1,0.55); lines2=mk(e2,0.35);
  hiLines=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({linewidth:2}));scene.add(hiLines);
  // structures named in the description get a ring so a reader can find what the text asked for
  for(const t of D.terms){if(!t.named_in_description)continue;const r=new THREE.Mesh(new THREE.TorusGeometry(SIZE[t.level]*2.2,0.22,8,40),new THREE.MeshBasicMaterial({}));r.position.copy(pos.get(t.id).v);r.userData.id=t.id;scene.add(r);namedRings.push(r);}
  // genes, when the genotype thread has written its map
  // genes: one marker per node that has a direct fish record (proxy species), sized by how many genes; the panel lists them
  const GN=(D.genotype&&!D.genotype.gated&&D.genotype.nodes)||{};
  for(const [id,ls] of Object.entries((D.genotype&&D.genotype.links)||{}))genesByNode.set(id,ls);
  geneIds=Object.entries(GN).filter(([id,n])=>n.direct&&T.has(id)).map(([id,n])=>({node:id,total:n.expressed_in+n.required_for+n.sufficient_for,strong:n.required_for+n.sufficient_for>0}));
  if(geneIds.length){
    geneInst=new THREE.InstancedMesh(new THREE.OctahedronGeometry(1,0),new THREE.MeshLambertMaterial({}),geneIds.length);
    const ga=new Float32Array(geneIds.length*6);
    geneIds.forEach((g,k)=>{const P=pos.get(g.node);const d=P.dir.clone();if(P.v.length()<1)d.set(0,1,0);
      g.s=0.7+0.45*Math.log10(1+g.total); g.v=P.v.clone().addScaledVector(d,SIZE[T.get(g.node).level]*2.2+g.s+1.2);
      ga.set([P.v.x,P.v.y,P.v.z,g.v.x,g.v.y,g.v.z],k*6);});
    const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.BufferAttribute(ga,3));
    geneLines=new THREE.LineSegments(gg,new THREE.LineBasicMaterial({transparent:true,opacity:0.7}));scene.add(geneLines);scene.add(geneInst);
  }
  placeInstances(); recolour();
  const st=$('#stage');
  const resize=()=>{const w=st.clientWidth,h=st.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();};
  addEventListener('resize',resize);resize();
  controls(el); overlays(unplaced); intro();
  if(params.get('spin')==='0'){spin=false;$('#spin').checked=false;}
  const f=params.get('find'); if(f){const t=D.terms.find(x=>x.label.toLowerCase().includes(f.toLowerCase())||x.id===f);if(t){select(t.id);}}
  requestAnimationFrame(frame);
  $('#showTissue').onchange=$('#showCell').onchange=$('#showGenes').onchange=()=>{placeInstances();};
  $('#spin').onchange=e=>{spin=e.target.checked;};
  $('#resetBtn').onclick=()=>{cam.theta=0.6;cam.phi=1.15;cam.dist=250;cam.target.set(0,0,0);};
  $('#pngBtn').onclick=savePNG; $('#svgBtn').onclick=saveSVG;
  $('#themeBtn').onclick=()=>{const c=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    const n=c==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem(tk,n)}catch{};readPalette();recolour();legend();};
  $('#q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(q.length<3)return;const t=D.terms.find(x=>x.label.toLowerCase().includes(q)||x.id.toLowerCase()===q);if(t)select(t.id);};
}
const visible=t=>(t.level!=='tissue'||$('#showTissue').checked)&&(t.level!=='cell'||$('#showCell').checked);
function placeInstances(){
  const m=new THREE.Matrix4();
  ids.forEach((id,i)=>{const t=T.get(id),p=pos.get(id).v;const s=visible(t)?SIZE[t.level]*(id===sel?1.8:1):0;m.makeScale(s,s,s).setPosition(p);inst.setMatrixAt(i,m);});
  inst.instanceMatrix.needsUpdate=true;
  const showEdge=L=>{const a=L.geometry.attributes.position.array;L.userData.edges.forEach((e,i)=>{const on=visible(T.get(e.part))&&visible(T.get(e.whole));const p=pos.get(e.part).v,w=pos.get(e.whole).v;if(on)a.set([p.x,p.y,p.z,w.x,w.y,w.z],i*6);else a.set([w.x,w.y,w.z,w.x,w.y,w.z],i*6);});L.geometry.attributes.position.needsUpdate=true;};
  showEdge(lines);showEdge(lines2);
  if(geneInst){const on=$('#showGenes').checked;geneIds.forEach((g,k)=>{const s=on&&visible(T.get(g.node))?g.s:0;m.makeScale(s,s,s).setPosition(g.v);geneInst.setMatrixAt(k,m);});geneInst.instanceMatrix.needsUpdate=true;geneLines.visible=on;}
  for(const r of namedRings)r.visible=visible(T.get(r.userData.id));
  highlight();
}
function recolour(){
  const c=new THREE.Color();
  ids.forEach((id,i)=>{c.set(levelColor(T.get(id).level));inst.setColorAt(i,c);});inst.instanceColor.needsUpdate=true;
  lines.material.color.set(PAL['--edge']);lines2.material.color.set(PAL['--edge2']);hiLines.material.color.set(PAL['--accent']);
  for(const r of namedRings)r.material.color.set(PAL['--named']);
  if(geneInst){c.set(PAL['--gene']);geneIds.forEach((g,k)=>geneInst.setColorAt(k,c));geneInst.instanceColor.needsUpdate=true;geneLines.material.color.set(PAL['--gene']);}
  renderer.setClearColor(0x000000,0);
}
function highlight(){
  const arr=[]; if(sel){for(const e of D.edges){if(e.part===sel||e.whole===sel){const p=pos.get(e.part).v,w=pos.get(e.whole).v;arr.push(p.x,p.y,p.z,w.x,w.y,w.z);}}}
  hiLines.geometry.setAttribute('position',new THREE.BufferAttribute(new Float32Array(arr),3));hiLines.geometry.attributes.position.needsUpdate=true;
}
function controls(el){
  let drag=null;

  el.addEventListener('pointermove',e=>{
    if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
      if(drag.b===2||drag.shift){const s=cam.dist/900;const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);cam.target.copy(drag.t).addScaledVector(right,-dx*s).addScaledVector(up,dy*s);}
      else{cam.theta=drag.th-dx*0.006;cam.phi=Math.min(Math.PI-0.05,Math.max(0.05,drag.ph-dy*0.006));}

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function pickAt(e){const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObject(inst);for(const h of hits){const id=ids[h.instanceId];if(visible(T.get(id)))return id;}
  if(geneInst&&$('#showGenes').checked){const gh=ray.intersectObject(geneInst);if(gh.length)return geneIds[gh[0].instanceId].node;}

const labelEls=new Map();
function frame(){

function labels(){

  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="Inter Tight, system-ui, sans-serif"><rect width="100%" height="100%" fill="${PAL['--surface']}"/>`;
  for(const e of D.edges){const a=pr.get(e.part),b=pr.get(e.whole);if(!a||!b)continue;const first=T.get(e.part).parents[0].id===e.whole;s+=`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${first?PAL['--edge']:PAL['--edge2']}" stroke-width="0.7" stroke-opacity="${first?0.6:0.4}"/>`;}
  if(geneInst&&$('#showGenes').checked)for(const g of geneIds){const a=pr.get(g.node);if(!a)continue;v.copy(g.v).project(camera);const bx=(v.x+1)/2*w,by=(1-v.y)/2*h,r=g.s*2.2*scale({z:v.z});s+=`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="${PAL['--gene']}" stroke-width="0.7"/><rect x="${(bx-r).toFixed(1)}" y="${(by-r).toFixed(1)}" width="${(2*r).toFixed(1)}" height="${(2*r).toFixed(1)}" transform="rotate(45 ${bx.toFixed(1)} ${by.toFixed(1)})" fill="${PAL['--gene']}"><title>${esc(T.get(g.node).label)}: ${g.total} genes with a direct proxy-fish record</title></rect>`;}
  for(const t of [...vis].sort((a,b)=>pr.get(b.id).z-pr.get(a.id).z)){const p=pr.get(t.id);const r=SIZE[t.level]*2.2*scale(p);s+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" fill="${levelColor(t.level)}"${t.named_in_description?` stroke="${PAL['--named']}" stroke-width="1.5"`:''}><title>${esc(t.label)} (${esc(t.id)})</title></circle>`;}
  for(const t of vis){if(t.level!=='organ_system'&&t.level!=='body'&&!t.named_in_description&&!(t.level==='organ'&&cam.dist<190))continue;const p=pr.get(t.id);s+=`<text x="${(p.x+SIZE[t.level]*2+3).toFixed(1)}" y="${(p.y+4).toFixed(1)}" font-size="${t.level==='organ_system'?12:11}" font-weight="${t.level==='organ_system'?700:400}" fill="${PAL['--ink']}">${esc(t.label)}</text>`;}
  const c=D.counts_distinct||{};
  s+=`<text x="12" y="${h-30}" font-size="11" fill="${PAL['--mute']}">Projection of an ontology hierarchy (Uberon / Cell Ontology part_of via Ubergraph), not anatomy. ${esc(D.description)}; ${esc(D.taxon?.label)}.</text>`;
  s+=`<text x="12" y="${h-14}" font-size="11" fill="${PAL['--mute']}">${c.organ_system} organ systems, ${c.organ} organs, ${c.tissue} tissues, ${c.cell} cell types; ${D.edges.length} part_of edges; structure kernel-checked in Lean, biology not${geneInst&&$('#showGenes').checked?`; gene records from proxy fish on ${geneIds.length} nodes, none from flying fish`:''}. Source ${esc(D.source.file)} sha256 ${esc(D.source.sha256.slice(0,12))}.</text></svg>`;
  const a=document.createElement('a');a.download='blueprint3d.svg';a.href=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));a.click();
}
})();
</script>
