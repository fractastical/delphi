<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Experiment 2: verified datasets out of 20, web fetch required">
<rect width="960" height="560" fill="#ffffff"/>
<text x="70" y="36" font-size="22" font-weight="700" fill="#14201f">Experiment 2: verified datasets out of 20, web fetch required</text>
<text x="70" y="58" font-size="13" fill="#5a6b69">Pre-registered rule: an arm beats another only with zero fabricated identifiers and at least 2 more verified datasets.</text>
<text x="70" y="76" font-size="13" fill="#5a6b69">One run per arm. "Verified" here also needs the agent to have fetched the landing page itself, per the run log.</text><line x1="70" x2="930" y1="440" y2="440" stroke="#5a6b69" stroke-width="1"/><text x="62" y="444" font-size="12" text-anchor="end" fill="#5a6b69">0</text><line x1="70" x2="930" y1="362.5" y2="362.5" stroke="#d9dfdb" stroke-width="1"/><text x="62" y="366.5" font-size="12" text-anchor="end" fill="#5a6b69">5</text><line x1="70" x2="930" y1="285" y2="285" stroke="#d9dfdb" stroke-width="1"/><text x="62" y="289" font-size="12" text-anchor="end" fill="#5a6b69">10</text><line x1="70" x2="930" y1="207.5" y2="207.5" stroke="#d9dfdb" stroke-width="1"/><text x="62" y="211.5" font-size="12" text-anchor="end" fill="#5a6b69">15</text><line x1="70" x2="930" y1="130" y2="130" stroke="#d9dfdb" stroke-width="1"/><text x="62" y="134" font-size="12" text-anchor="end" fill="#5a6b69">20</text><text x="24" y="285" font-size="12" fill="#5a6b69" transform="rotate(-90 24 285)" text-anchor="middle">verified datasets (of 20)</text><path d="M147.4 440 V258 a4 4 0 0 1 4 -4 H203.60000000000002 a4 4 0 0 1 4 4 V440 Z" fill="#0e7c86"/><text x="177.5" y="246" font-size="15" font-weight="700" text-anchor="middle" fill="#14201f">12</text><text x="177.5" y="456" font-size="11" text-anchor="middle" fill="#5a6b69">primary run</text><text x="177.5" y="480" font-size="14" font-weight="600" text-anchor="middle" fill="#14201f">single agent</text><text x="177.5" y="498" font-size="12" text-anchor="middle" fill="#5a6b69">$0.52 list price, 2.0 min, 1 call</text><path d="M362.4 440 V196 a4 4 0 0 1 4 -4 H418.59999999999997 a4 4 0 0 1 4 4 V440 Z" fill="#0e7c86"/><text x="392.5" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#14201f">16</text><text x="392.5" y="456" font-size="11" text-anchor="middle" fill="#5a6b69">primary run</text><text x="392.5" y="480" font-size="14" font-weight="600" text-anchor="middle" fill="#14201f">isolated workers</text><text x="392.5" y="498" font-size="12" text-anchor="middle" fill="#5a6b69">$4.48 list price, 2.2 min, 20 calls</text><path d="M577.4 440 V165 a4 4 0 0 1 4 -4 H633.6 a4 4 0 0 1 4 4 V440 Z" fill="#0e7c86"/><text x="607.5" y="153" font-size="15" font-weight="700" text-anchor="middle" fill="#14201f">18</text><text x="607.5" y="456" font-size="11" text-anchor="middle" fill="#5a6b69">primary run</text><text x="607.5" y="480" font-size="14" font-weight="600" text-anchor="middle" fill="#14201f">centralized swarm</text><text x="607.5" y="498" font-size="12" text-anchor="middle" fill="#5a6b69">$5.61 list price, 3.6 min, 26 calls</text><path d="M792.4 440 V180.5 a4 4 0 0 1 4 -4 H848.6 a4 4 0 0 1 4 4 V440 Z" fill="#0e7c86"/><text x="822.5" y="168.5" font-size="15" font-weight="700" text-anchor="middle" fill="#14201f">17</text><text x="822.5" y="456" font-size="11" text-anchor="middle" fill="#5a6b69">primary run</text><text x="822.5" y="480" font-size="14" font-weight="600" text-anchor="middle" fill="#14201f">decentralized board</text><text x="822.5" y="498" font-size="12" text-anchor="middle" fill="#5a6b69">$6.37 list price, 2.7 min, 26 calls</text><rect x="70" y="90" width="12" height="12" rx="2" fill="#0e7c86"/><text x="88" y="100" font-size="12" fill="#14201f">primary run (decides)</text><text x="70" y="532" font-size="12" fill="#14201f">centralized beats single · centralized beats isolated · decentralized beats single · isolated beats single</text><text x="70" y="550" font-size="11" fill="#5a6b69">DELPHI swarm thread, ScienceClaw 2026-10-31. Model claude-sonnet-5-5. "Verified" = the landing page returns HTTP 200 and names the dataset. Built from results.json.</text></svg>