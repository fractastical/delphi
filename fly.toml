app = "delphisci-mcp"
primary_region = "iad"

[env]
  DELPHI_HTTP_PORT = "8080"
  DELPHI_METRICS_PORT = "9091"

# Fly scrapes this privately (port 9091 is not exposed) into its managed Prometheus; view in
# Grafana at https://fly-metrics.net. Series are named delphi_mcp_*; see mcp/metrics.mjs.
[metrics]
  port = 9091
  path = "/metrics"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
